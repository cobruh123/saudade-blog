<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin Login</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', path='css/styles.css') }}"
    >
</head>

<body>

<main class="login-page">

    <div class="login-card">

        <h1>Welcome back</h1>

        <p>
            Login to manage your blog.
        </p>

        <form class="login-form"
            action="/admin/login"
            method="post"
        >

            <label for="username">
                Username
            </label>

            <input
                id="username"
                name="username"
                type="text"
                required
            >


            <label for="password">
                Password
            </label>

            <input
                id="password"
                name="password"
                type="password"
                required
            >


            <button
                type="submit"
                class="button"
            >
                Login
            </button>

        </form>

    </div>

</main>

</body>

</html>
